name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
          architecture: x64
      - name: Install exact build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-lock.txt
      - name: Test and build Windows software
        shell: pwsh
        run: |
          node tests/check-controls.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Audio controls tests failed.' }
          ./build.ps1 -SkipInstall
      - name: Keep release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Better-SMTC-Bridge-1.0.0-Windows-x64
          path: |
            dist/Better-SMTC-Bridge-1.0.0-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
